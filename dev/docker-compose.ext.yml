# A third server, for `dev/probe_ext.exs`'s mounted route: Latu's image and settings, with the
# jars in `tmp/jars` on the classpath through `--jars` — the way an administrator would place
# them. Port 15004, UI 4042. Standalone; Latu's compose file is untouched.
#
#     bash dev/fetch_jars.sh
#     docker compose -f dev/docker-compose.ext.yml up -d --wait
#     SPARK_REMOTE=sc://localhost:15004 mix run dev/probe_ext.exs -- --mounted
#     docker compose -f dev/docker-compose.ext.yml down
services:
  spark-ext:
    image: apache/spark:4.2.0
    container_name: latu-spark-ext
    ports:
      - "15004:15002"
      - "4042:4040"
    entrypoint: ["/opt/spark/sbin/start-connect-server.sh"]
    command:
      - "--wait"
      - "--master"
      - "local[1]"
      - "--jars"
      - "/jars/xgboost4j-spark_2.13-3.4.0.jar,/jars/isolation-forest_4.1.1_2.13-4.1.8.jar,/jars/spark-avro_2.13-4.2.0.jar"
      - "--conf"
      - "spark.connect.grpc.binding.address=0.0.0.0"
      - "--conf"
      - "spark.connect.grpc.binding.port=15002"
      - "--conf"
      - "spark.sql.session.timeZone=UTC"
      - "--conf"
      - "spark.sql.shuffle.partitions=4"
      - "--conf"
      - "spark.ui.port=4040"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/15002"]
      interval: 5s
      timeout: 3s
      retries: 36
      start_period: 15s
    volumes:
      - ../tmp/jars:/jars:ro
